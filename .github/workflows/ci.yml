name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sets up the vp CLI, the Node version and the package manager in one
      # step, so no setup-node or pnpm setup is needed. Pinned to an exact
      # version: the moving v1 tag stopped being updated at v1.15.0.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          # No node-version: Vite+ resolves it from devEngines.runtime.
          cache: true

      - run: vp install --frozen-lockfile

      # Format, lint and typecheck. No --fix: CI reports, it does not rewrite.
      - name: Check
        run: vp check

      - name: Test
        run: vp test

      # The GraphQL types come from GitHub's published schema and the JSON
      # Schema from the valibot one. Both are committed, so a source edited
      # without a regen leaves a stale file behind.
      - name: Generated files are up to date
        run: |
          vp run codegen
          vp run schema
          git diff --exit-code -- src/adapters/github/generated schema

      # Catches a Worker that type-checks but cannot be bundled, before the
      # deploy that Cloudflare runs on merge does.
      - name: Bundle
        run: vp exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
